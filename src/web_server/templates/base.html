<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Nutrition Tracker{% endblock %}</title>
  <style>
:root {
  --bg: #0f0f14;
  --surface: #1a1a2e;
  --surface2: #22223a;
  --border: #2e2e50;
  --accent: #6c63ff;
  --accent2: #a78bfa;
  --text: #e0e0f0;
  --text-dim: #8888aa;
  --success: #4ade80;
  --danger: #f87171;
  --warning: #fbbf24;
  --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 16px;
  line-height: 1.5;
}
a { color: var(--accent2); text-decoration: none; }
a:hover { text-decoration: underline; }
nav {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0.75rem 1rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
  position: sticky;
  top: 0;
  z-index: 10;
}
.nav-brand {
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--accent2);
  white-space: nowrap;
}
.nav-links {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}
.nav-links a {
  color: var(--text-dim);
  padding: 0.25rem 0.6rem;
  border-radius: 6px;
  font-size: 0.9rem;
  transition: background 0.15s, color 0.15s;
}
.nav-links a:hover, .nav-links a.active {
  background: var(--surface2);
  color: var(--text);
  text-decoration: none;
}
.nav-links a.cta {
  background: var(--accent);
  color: #fff;
}
.nav-links a.cta:hover { background: var(--accent2); }
.nav-links a.cta.active { background: var(--accent2); }
main {
  max-width: 840px;
  margin: 0 auto;
  padding: 1.5rem 1rem 3rem;
}
h1 { font-size: 1.6rem; margin-bottom: 0.5rem; }
h2 { font-size: 1.25rem; margin-bottom: 0.75rem; color: var(--accent2); }
h3 { font-size: 1.05rem; margin-bottom: 0.5rem; color: var(--text-dim); font-weight: 600; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1rem 1.25rem;
  margin-bottom: 1rem;
}
.card h2 { margin-bottom: 0.5rem; }
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 0.75rem;
  margin-top: 0.5rem;
}
.stat-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.75rem;
  text-align: center;
}
.stat-value {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--accent2);
}
.stat-label {
  font-size: 0.8rem;
  color: var(--text-dim);
  margin-top: 0.1rem;
}
form { display: flex; flex-direction: column; gap: 0.75rem; }
.form-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.form-row input, .form-row select { flex: 1; min-width: 120px; }
label { font-size: 0.875rem; color: var(--text-dim); margin-bottom: 0.1rem; display: block; }
input, select, textarea {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  padding: 0.5rem 0.75rem;
  font-size: 0.95rem;
  width: 100%;
  outline: none;
  transition: border-color 0.15s;
}
input:focus, select:focus, textarea:focus {
  border-color: var(--accent);
}
input::placeholder { color: var(--text-dim); }
input.invalid { border-color: var(--danger); }
input.valid   { border-color: var(--success); }
button, .btn {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 0.55rem 1.1rem;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
  white-space: nowrap;
}
button:hover, .btn:hover { background: var(--accent2); }
button.secondary {
  background: var(--surface2);
  color: var(--text);
  border: 1px solid var(--border);
}
button.secondary:hover { background: var(--border); }
button.danger { background: var(--danger); }
.log-list { list-style: none; }
.log-item {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.95rem;
}
.log-item:last-child { border-bottom: none; }
.log-item .alias { font-weight: 600; }
.log-item .qty { color: var(--text-dim); }
.log-item .cal { color: var(--accent2); margin-left: auto; font-size: 0.85rem; }
.badge {
  display: inline-block;
  padding: 0.1rem 0.5rem;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 600;
}
.badge-ate { background: #1e3a2a; color: var(--success); }
.badge-exercised { background: #2a1e3a; color: var(--accent2); }
.badge-meal { background: #2a2a1e; color: var(--warning); }
.alert {
  padding: 0.75rem 1rem;
  border-radius: var(--radius);
  font-size: 0.9rem;
  margin-top: 0.5rem;
}
.alert-success { background: #1e3a2a; color: var(--success); border: 1px solid #2d5a40; }
.alert-error { background: #3a1e1e; color: var(--danger); border: 1px solid #5a2d2d; }
.repeatable-list { display: flex; flex-direction: column; gap: 0.5rem; }
.repeatable-item { display: flex; gap: 0.5rem; align-items: center; }
.repeatable-item input { flex: 1; }
.section-title {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.75rem;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.4rem;
}
.empty-state {
  color: var(--text-dim);
  text-align: center;
  padding: 2rem;
  font-style: italic;
}
.day-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.65rem 0.9rem;
  background: var(--surface2);
  border-radius: 6px;
  margin-bottom: 0.4rem;
  color: var(--text);
  transition: background 0.15s;
}
.day-link:hover { background: var(--border); text-decoration: none; }
.day-link .day-date { font-weight: 600; }
.day-link .day-meta { color: var(--text-dim); font-size: 0.85rem; }
.pagination {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-top: 1rem;
  font-size: 0.9rem;
  color: var(--text-dim);
}
.pagination button { padding: 0.3rem 0.75rem; font-size: 0.85rem; }
.pagination .page-info { flex: 1; text-align: center; }
@media (max-width: 500px) {
  .stats-grid { grid-template-columns: repeat(2, 1fr); }
  .form-row { flex-direction: column; }
  nav { padding: 0.5rem; }
}
  </style>
  <script>
function fmt(amount, unit) {
  const a = Math.abs(amount - Math.round(amount)) < 0.005 ? Math.round(amount) : amount.toFixed(1);
  return unit ? `${a} ${unit}` : `${a}`;
}

function parseQuantityStr(s) {
  s = (s || '').trim();
  const m = s.match(/^([0-9]+(?:\.[0-9]+)?)\s*(.*)$/);
  if (!m) return null;
  return { amount: parseFloat(m[1]), unit: m[2].trim() || null };
}

function addRemoveHandlers() {
  document.querySelectorAll('.remove-btn').forEach(btn => {
    btn.onclick = () => {
      const list = btn.closest('.repeatable-list');
      if (list.querySelectorAll('.repeatable-item').length > 1) btn.closest('.repeatable-item').remove();
    };
  });
}
  </script>
</head>
<body>
<nav>
  <div class="nav-brand">🥗 Nutrition</div>
  <div class="nav-links">
    <a href="/" {% if active == "home" %}class="active"{% endif %}>Today</a>
    <a href="/calendar" {% if active == "calendar" %}class="active"{% endif %}>Calendar</a>
    <a href="/query" {% if active == "query" %}class="active"{% endif %}>Search</a>
    <a href="/ingredients/new" class="cta{% if active == "new_ingredient" %} active{% endif %}">+ Food</a>
    <a href="/recipes/new" class="cta{% if active == "new_recipe" %} active{% endif %}">+ Recipe</a>
    <a href="/exercises/new" class="cta{% if active == "new_exercise" %} active{% endif %}">+ Exercise</a>
  </div>
</nav>
<main>
{% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
