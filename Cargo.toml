[workspace]
members = [".", "nutrition-units"]

[package]
name = "nutrition_rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nutrition"
path = "src/main.rs"

[lib]
name = "nutrition_rs"
path = "src/lib.rs"

[dependencies]
nutrition-units = { path = "nutrition-units" }
async-openai = {version = "0.32.3", features = ["chat-completion"]}
async-trait = "0.1.89"
axum = "0.8.8"
chumsky = "0.12.0"
clap = { version = "4.5.54", features = ["derive", "env"] }
logos = "0.16.0"
schemars = "1.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features= ["macros", "rt-multi-thread"]}

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
tower = "0.4"
