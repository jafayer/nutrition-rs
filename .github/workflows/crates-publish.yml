name: Publish crates.io

on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crates-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Ensure token is set
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "Missing required secret: CARGO_REGISTRY_TOKEN"
            exit 1
          fi

      - name: Publish nutrition_rs (if needed)
        shell: bash
        run: |
          set -euo pipefail
          PKG="nutrition_rs"
          VER=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="nutrition_rs") | .version')
          URL="https://crates.io/api/v1/crates/${PKG}/${VER}"
          if curl -fsSL "$URL" >/dev/null 2>&1; then
            echo "${PKG} ${VER} already published, skipping"
          else
            cargo publish -p "${PKG}" --token "${CARGO_REGISTRY_TOKEN}"
          fi